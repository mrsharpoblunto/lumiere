name: Build and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push waits for the deploy in progress, so an older build never replaces a newer one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build vibes
        run: npm run build:www

      - name: Check the Worker configs
        run: |
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run --config wrangler.redirect.jsonc

      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        run: |
          npx wrangler deploy
          npx wrangler deploy --config wrangler.redirect.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the deployed site
        if: github.event_name == 'push'
        run: |
          # The retries cover the DNS records and the certificates of the first deploy.
          curl --silent --show-error --fail --retry 12 --retry-delay 10 --retry-all-errors \
            --output /dev/null https://pixelheart.io/
          for host in vibes.pixelheart.io www.pixelheart.io; do
            redirect=$(curl --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
              --output /dev/null --write-out '%{redirect_url}' "https://$host/")
            if [ "$redirect" != "https://pixelheart.io/" ]; then
              echo "::error::$host redirects to '$redirect', not to https://pixelheart.io/."
              exit 1
            fi
          done
